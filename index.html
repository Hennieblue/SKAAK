<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKAAK SPEEL</title>
<style>
* { box-sizing:border-box; }
body {
  font-family:Arial,sans-serif;
  background:#17212b;color:white;
  margin:0;padding:15px;
}
main {max-width:650px;margin:auto;}
h1,h2 {text-align:center;}
.panel {
  background:#263746;padding:14px;
  border-radius:8px;margin:12px 0;
}
label {display:block;font-weight:bold;margin-bottom:9px;}
button,input {
  font-size:18px;padding:12px;border-radius:6px;
}
button {cursor:pointer;}
button:focus,input:focus {
  outline:4px solid #ffd54f;
  outline-offset:2px;
}
.choices,.controls {
  display:flex;flex-wrap:wrap;gap:9px;
}
.choices button,.controls button {flex:1;min-width:90px;}
.active {background:#187b45;color:white;border:2px solid white;}
.inactive {background:#e2e8f0;color:#17212b;border:2px solid #888;}
input {width:100%;margin-bottom:10px;}
.primary {background:#187b45;color:white;border:0;}
#status {line-height:1.6;font-weight:bold;}
#history {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-family:monospace;
  font-size:17px;line-height:1.8;
}
#board {
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  width:100%;max-width:520px;
  margin:12px auto;border:3px solid #ddd;
}
.square {
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(23px,8vw,48px);
  border:0;padding:0;min-width:0;
}
.light {background:#f0d9b5;color:#171717;}
.dark {background:#9b7653;color:#171717;}
.selected {background:#facc15!important;}
.square:focus {outline:4px solid yellow;outline-offset:-4px;}
.row-summary {
  position:absolute;
  width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);
  white-space:nowrap;border:0;
}
</style>
</head>
<body>
<main>

<h1>♟ SKAAK SPEEL</h1>

<div class="panel">
  <h2>Jou skuif</h2>
  <form id="moveForm">
    <label for="moveInput">
      Tik jou skuif, byvoorbeeld e4, Nf3 of O-O:
    </label>
    <input id="moveInput" type="text"
      placeholder="Tik jou skuif hier"
      autocomplete="off" autocapitalize="off"
      spellcheck="false">
    <button class="primary" type="submit">Maak skuif</button>
  </form>

  <div class="panel" style="margin-top:12px;">
    <h2>Skuifgeskiedenis</h2>
    <div id="history" aria-live="polite">
      Nog geen skuiwe nie.
    </div>
  </div>

  <div class="controls">
    <button id="undo">Neem terug</button>
    <button id="restart">Nuwe wedstryd</button>
  </div>
</div>

<div class="panel">
  <label>Kies Stockfish se sterkte:</label>
  <div class="choices">
    <button id="weak" class="inactive" type="button">Swak</button>
    <button id="medium" class="active" type="button">Medium</button>
    <button id="strong" class="inactive" type="button">Sterk</button>
  </div>
  <p id="levelInfo">Medium – Skill 6 – 1 sekonde</p>
</div>

<div class="panel" id="status" role="status" aria-live="polite">
  Stockfish laai...
</div>



<div class="panel">
  <label>Kies jou kleur:</label>
  <div class="choices">
    <button id="white" class="active" type="button">Wit</button>
    <button id="black" class="inactive" type="button">Swart</button>
  </div>
</div>



<h2>Skaakbord</h2>
<div id="board" role="group" aria-label="Skaakbord"></div>

<footer>SKAAK SPEEL</footer>
</main>

<script type="module">
import { Chess } from
"https://esm.sh/chess.js@1.4.0";

const game = new Chess();
const board = document.getElementById("board");
const status = document.getElementById("status");
const history = document.getElementById("history");
const input = document.getElementById("moveInput");
const levelInfo = document.getElementById("levelInfo");

const pieces = {
  wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",
  bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"
};

const names = {
  k:"koning",q:"dame",r:"toring",
  b:"loper",n:"perd",p:"pion"
};

const levels = {
  weak:{skill:1,time:100,label:"Swak"},
  medium:{skill:6,time:1000,label:"Medium"},
  strong:{skill:15,time:3000,label:"Sterk"}
};

let playerColor = "w";
let selectedLevel = "medium";
let engine = null;
let engineReady = false;
let thinking = false;
let selectedSquare = null;
let engineReadyPromise = false;

function announce(message) {
  status.textContent = message;
}

function setColor(color) {
  if (game.history().length || thinking) {
    announce("Begin eers 'n nuwe wedstryd om jou kleur te verander.");
    return;
  }

  playerColor = color;
  updateChoices();

  announce(color === "w" ?
    "Jy speel Wit. Jou eerste skuif." :
    "Jy speel Swart. Stockfish maak eerste sy skuif.");

  if (color === "b" && engineReady) {
    computerMove();
  }
}

function updateChoices() {
  document.getElementById("white").className =
    playerColor === "w" ? "active" : "inactive";
  document.getElementById("black").className =
    playerColor === "b" ? "active" : "inactive";

  ["weak","medium","strong"].forEach(id => {
    document.getElementById(id).className =
      selectedLevel === id ? "active" : "inactive";
  });

  const level = levels[selectedLevel];
  levelInfo.textContent =
    level.label + " – Skill " + level.skill +
    " – " + level.time/1000 + " sekonde";
}

function changeLevel(level) {
  if (thinking) {
    announce("Wag totdat Stockfish klaar is.");
    return;
  }

  selectedLevel = level;
  updateChoices();

  if (engineReady) {
    engine.postMessage(
      "setoption name Skill Level value " +
      levels[level].skill
    );
  }

  announce("Stockfish se sterkte: " +
    levels[level].label + ", Skill " +
    levels[level].skill + ".");
}

function updateHistory() {
  const moves = game.history();

  if (!moves.length) {
    history.textContent = "Nog geen skuiwe nie.";
    return;
  }

  const lines = [];

  for (let i=0;i<moves.length;i+=2) {
    lines.push(
      (Math.floor(i/2)+1) + ". " +
      moves[i] + (moves[i+1] ? "   "+moves[i+1] : "")
    );
  }

  history.textContent = lines.join("\n");
}


function renderBoard() {
  board.innerHTML = "";
  const position = game.board();

  for (let r = 0; r < 8; r++) {
    const row = document.createElement("div");
    row.style.display = "contents";

    const descriptions = [];

    for (let c = 0; c < 8; c++) {
      const square = position[r][c];
      const name = "abcdefgh"[c] + (8-r);

      const description = square
        ? (square.color === "w" ? "wit " : "swart ") +
          names[square.type]
        : "leeg";

      descriptions.push(name + " " + description);

      const button = document.createElement("button");
      button.type = "button";
      button.className = "square " +
        ((r+c)%2===0 ? "light" : "dark");

      if (selectedSquare === name) {
        button.classList.add("selected");
      }

      button.setAttribute("aria-hidden", "true");
      button.tabIndex = -1;

      button.textContent = square
        ? pieces[(square.color==="w"?"w":"b")+square.type]
        : "";

      button.addEventListener("click", () => selectSquare(name));

      row.appendChild(button);
    }

    row.setAttribute("role", "group");
    row.setAttribute(
      "aria-label",
      "Ry " + (8-r) + ": " + descriptions.join(", ")
    );

    board.appendChild(row);
  }

  updateHistory();
}

function isPlayerTurn() {
  return game.turn() === playerColor;
}

function selectSquare(square) {
  if (thinking || game.isGameOver() || !isPlayerTurn()) return;

  if (!selectedSquare) {
    const piece = game.get(square);

    if (!piece || piece.color !== playerColor) {
      announce("Kies een van jou eie skaakstukke.");
      return;
    }

    selectedSquare = square;
    renderBoard();
    announce("Gekies: " + square + ". Kies jou bestemming.");
    return;
  }

  const from = selectedSquare;
  selectedSquare = null;

  try {
    const move = game.move({
      from,to:square,promotion:"q"
    });

    if (!move) throw new Error("Ongeldige skuif");
    afterHumanMove(move);

  } catch(error) {
    renderBoard();
    announce("Ongeldige skuif. Probeer weer.");
  }
}

function makeHumanMove(notation) {
  if (thinking || !engineReady || game.isGameOver() ||
      !isPlayerTurn()) {
    announce("Wag vir Stockfish se skuif.");
    return;
  }

  try {
    const text = notation.trim();
    let move;

    if (/^[a-h][1-8][a-h][1-8][qrbnQRBN]?$/.test(text)) {
      move = game.move({
        from:text.substring(0,2),
        to:text.substring(2,4),
        promotion:(text[4]||"q").toLowerCase()
      });
    } else {
      move = game.move(text);
    }

    if (!move) throw new Error("Ongeldige skuif");
    afterHumanMove(move);

  } catch(error) {
    announce("Ongeldige skuif. Probeer byvoorbeeld e4, Nf3 of O-O.");
    input.focus();
  }
}

function afterHumanMove(move) {
  selectedSquare = null;
  input.value = "";
  renderBoard();

  announce("Jy speel: " + move.san);

  if (game.isGameOver()) {
    finishGame();
    return;
  }

  computerMove();
}

function computerMove() {
  if (!engineReady || !engine || game.isGameOver()) return;

  thinking = true;
  announce("Stockfish dink...");

  engine.postMessage("position fen " + game.fen());

  engine.postMessage(
    "go movetime " + levels[selectedLevel].time
  );
}

function finishGame() {
  thinking = false;

  if (game.isCheckmate()) {
    announce("Skaakmat! " +
      (game.turn() === "w" ? "Swart" : "Wit") + " wen.");
  } else if (game.isStalemate()) {
    announce("Gelykop. Pat.");
  } else if (game.isDraw()) {
    announce("Die wedstryd is gelykop.");
  }
}

function startEngine() {
  try {
    engine = new Worker("./stockfish-19-lite-single.js");

    engine.onmessage = function(event) {
      const message = String(event.data);

      if (message === "uciok") {
        engine.postMessage(
          "setoption name Skill Level value " +
          levels[selectedLevel].skill
        );
        engine.postMessage("isready");
      }

      if (message === "readyok") {
        engineReady = true;
        announce("Stockfish gereed! Jy speel " +
          (playerColor==="w"?"Wit":"Swart") +
          ". Sterkte: " + levels[selectedLevel].label + ".");

        if (playerColor === "b" && game.history().length===0) {
          computerMove();
        }
      }

      if (message.startsWith("bestmove")) {
        const uci = message.split(/\s+/)[1];
        thinking = false;

        if (uci && uci !== "(none)") {
          try {
            const move = game.move({
              from:uci.substring(0,2),
              to:uci.substring(2,4),
              promotion:uci[4] || "q"
            });

            renderBoard();

            if (game.isGameOver()) {
              finishGame();
            } else {
              announce("Stockfish: " + move.san);
              input.focus();
            }
          } catch(error) {
            announce("Probleem met Stockfish se skuif.");
          }
        } else {
          finishGame();
        }
      }
    };

    engine.onerror = function() {
      engineReady = false;
      thinking = false;
      announce("Stockfish kon nie begin nie. Kontroleer die engine-lêers.");
    };

    engine.postMessage("uci");

  } catch(error) {
    announce("Probleem met Stockfish: " + error.message);
  }
}

document.getElementById("moveForm")
.addEventListener("submit",event=>{
  event.preventDefault();
  makeHumanMove(input.value);
});

document.getElementById("white").addEventListener("click",()=>{
  setColor("w");
});
document.getElementById("black").addEventListener("click",()=>{
  setColor("b");
});

document.getElementById("weak").addEventListener("click",()=>{
  changeLevel("weak");
});
document.getElementById("medium").addEventListener("click",()=>{
  changeLevel("medium");
});
document.getElementById("strong").addEventListener("click",()=>{
  changeLevel("strong");
});

document.getElementById("undo").addEventListener("click",()=>{
  if (thinking) {
    announce("Wag totdat Stockfish klaar is.");
    return;
  }

  if (!game.history().length) return;

  game.undo();

  if (game.history().length && game.turn() !== playerColor) {
    game.undo();
  }

  selectedSquare = null;
  renderBoard();
  announce("Skuif terug geneem. Jou beurt.");
  input.focus();
});

document.getElementById("restart").addEventListener("click",()=>{
  if (thinking && engine) {
    engine.postMessage("stop");
  }

  thinking = false;
  game.reset();
  selectedSquare = null;
  renderBoard();

  announce("Nuwe wedstryd. Jy speel " +
    (playerColor==="w"?"Wit":"Swart") + ".");

  if (playerColor === "b" && engineReady) {
    computerMove();
  } else {
    input.focus();
  }
});

updateChoices();
renderBoard();
startEngine();
</script>
</body>
</html>
