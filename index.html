<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKAAK SPEEL</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #17212b;
  color: white;
  margin: 0;
  padding: 15px;
}

main {
  max-width: 650px;
  margin: auto;
}

h1, h2 { text-align: center; }

h1 { font-size: 30px; }

.panel {
  background: #263746;
  padding: 14px;
  border-radius: 8px;
  margin: 12px 0;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

select, input, button {
  font-size: 18px;
  padding: 12px;
  border-radius: 6px;
}

select, input {
  width: 100%;
  background: white;
  color: #111;
  border: 2px solid #aaa;
}

button {
  cursor: pointer;
}

button:focus, input:focus, select:focus {
  outline: 4px solid #ffd54f;
  outline-offset: 2px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.controls button {
  flex: 1;
  min-width: 110px;
}

.primary {
  background: #187b45;
  color: white;
  border: 0;
}

#status {
  font-size: 17px;
  line-height: 1.5;
}

#history {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: monospace;
  font-size: 17px;
  line-height: 1.8;
  min-height: 45px;
}

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: 100%;
  max-width: 520px;
  margin: 15px auto;
  border: 3px solid #ddd;
}

.square {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(23px, 8vw, 48px);
  border: 0;
  padding: 0;
  cursor: pointer;
  min-width: 0;
}

.light {
  background: #f0d9b5;
  color: #171717;
}

.dark {
  background: #9b7653;
  color: #171717;
}

.square:focus {
  outline: 4px solid yellow;
  outline-offset: -4px;
}

.selected {
  background: #facc15 !important;
}

footer {
  text-align: center;
  color: #ccc;
  margin: 20px 0;
}
</style>
</head>

<body>
<main>

<h1>♟ SKAAK SPEEL</h1>

<div class="panel">
  <label for="difficulty">Kies Stockfish se sterkte:</label>

  <select id="difficulty">
    <option value="1">Maklik – Skill 1 – 0 sekondes</option>
    <option value="6" selected>Medium – Skill 6 – 1 sekonde</option>
    <option value="12">Sterk – Skill 12 – 2 sekondes</option>
    <option value="18">Baie sterk – Skill 18 – 5 sekondes</option>
    <option value="20">Maksimum – Skill 20 – 10 sekondes</option>
  </select>
</div>

<div class="panel" id="status" role="status" aria-live="polite">
  Stockfish laai...
</div>

<div class="panel">
  <h2>Jou skuif</h2>

  <form id="moveForm">
    <label for="moveInput">
      Tik jou skuif, byvoorbeeld e4, Nf3 of O-O:
    </label>

    <input
      id="moveInput"
      type="text"
      placeholder="Tik jou skuif hier"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false">

    <div class="controls">
      <button class="primary" type="submit">
        Maak skuif
      </button>
    </div>
  </form>

  <div class="controls">
    <button id="undo">Neem terug</button>
    <button id="restart">Nuwe wedstryd</button>
  </div>
</div>

<div class="panel">
  <h2>Skuifgeskiedenis</h2>
  <div id="history" aria-live="polite">
    Nog geen skuiwe nie.
  </div>
</div>

<h2>Skaakbord</h2>

<div id="board" role="group" aria-label="Skaakbord"></div>

<footer>
  SKAAK SPEEL – Hennieblue
</footer>

</main>

<script type="module">
import { Chess } from
"https://esm.sh/chess.js@1.4.0";

const game = new Chess();

const board = document.getElementById("board");
const status = document.getElementById("status");
const history = document.getElementById("history");
const input = document.getElementById("moveInput");
const difficulty = document.getElementById("difficulty");

const pieces = {
  wk:"♔", wq:"♕", wr:"♖", wb:"♗",
  wn:"♘", wp:"♙",
  bk:"♚", bq:"♛", br:"♜",
  bb:"♝", bn:"♞", bp:"♟"
};

const pieceNames = {
  k:"koning",
  q:"dame",
  r:"toring",
  b:"loper",
  n:"perd",
  p:"pion"
};

let engine = null;
let engineReady = false;
let thinking = false;
let selectedSquare = null;
let ignoreBestMove = false;

function announce(message) {
  status.textContent = message;
}

function renderBoard() {
  board.innerHTML = "";

  const position = game.board();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const square = position[r][c];
      const name = "abcdefgh"[c] + (8-r);

      const button = document.createElement("button");

      button.className =
        "square " +
        ((r+c)%2 === 0 ? "light" : "dark");

      if (selectedSquare === name) {
        button.classList.add("selected");
      }

      const description = square
        ? (square.color === "w" ? "wit " : "swart ") +
          pieceNames[square.type]
        : "leeg";

      button.setAttribute(
        "aria-label",
        name + " " + description
      );

      button.textContent = square
        ? pieces[(square.color === "w" ? "w" : "b") +
          square.type]
        : "";

      button.addEventListener("click", () => {
        selectSquare(name);
      });

      board.appendChild(button);
    }
  }

  updateHistory();
}

function updateHistory() {
  const moves = game.history();

  if (!moves.length) {
    history.textContent = "Nog geen skuiwe nie.";
    return;
  }

  const lines = [];

  for (let i = 0; i < moves.length; i += 2) {
    const number = Math.floor(i / 2) + 1;
    const white = moves[i];
    const black = moves[i + 1] || "";

    lines.push(
      number + ". " + white +
      (black ? "   " + black : "")
    );
  }

  history.textContent = lines.join("\n");
}

function selectSquare(square) {
  if (thinking || game.isGameOver() ||
      game.turn() !== "w") return;

  if (!selectedSquare) {
    const piece = game.get(square);

    if (!piece || piece.color !== "w") {
      announce("Kies eers een van jou wit skaakstukke.");
      return;
    }

    selectedSquare = square;
    renderBoard();

    announce("Gekies: " + square +
      ". Kies jou bestemming.");

    return;
  }

  const from = selectedSquare;
  const to = square;

  selectedSquare = null;

  try {
    const move = game.move({
      from: from,
      to: to,
      promotion: "q"
    });

    if (!move) throw new Error("Ongeldige skuif");

    afterHumanMove(move);

  } catch (error) {
    selectedSquare = null;
    renderBoard();
    announce("Ongeldige skuif. Probeer weer.");
  }
}

function makeHumanMove(notation) {
  if (thinking || !engineReady ||
      game.isGameOver() || game.turn() !== "w") {
    announce("Wag vir die rekenaar of begin 'n nuwe wedstryd.");
    return;
  }

  try {
    let move;

    const text = notation.trim();

    if (/^[a-h][1-8][a-h][1-8][qrbnQRBN]?$/.test(text)) {
      move = game.move({
        from: text.substring(0,2),
        to: text.substring(2,4),
        promotion: (text[4] || "q").toLowerCase()
      });
    } else {
      move = game.move(text);
    }

    if (!move) throw new Error("Ongeldige skuif");

    afterHumanMove(move);

  } catch (error) {
    announce("Ongeldige skuif. Probeer byvoorbeeld e4, Nf3 of O-O.");
    input.focus();
  }
}

function afterHumanMove(move) {
  selectedSquare = null;
  input.value = "";

  renderBoard();

  if (game.isGameOver()) {
    finishGame();
    return;
  }

  announce("Jy speel " + move.san +
    ". Stockfish dink nou.");

  computerMove();
}

function computerMove() {
  if (!engine || !engineReady || game.isGameOver()) return;

  thinking = true;

  engine.postMessage("position fen " + game.fen());

  const skill = Number(difficulty.value);

  const times = {
    1:100,
    6:1000,
    12:2000,
    18:5000,
    20:10000
  };

  engine.postMessage("go movetime " + times[skill]);
}

function finishGame() {
  thinking = false;

  if (game.isCheckmate()) {
    announce("Skaakmat! " +
      (game.turn() === "w" ? "Swart" : "Wit") +
      " wen.");
  } else if (game.isStalemate()) {
    announce("Gelykop. Pat.");
  } else if (game.isDraw()) {
    announce("Die wedstryd is gelykop.");
  }
}

function applyDifficulty() {
  if (!engine || !engineReady) return;

  engine.postMessage(
    "setoption name Skill Level value " +
    difficulty.value
  );
}

function startEngine() {
  try {
    engine = new Worker("./stockfish-19-lite-single.js");

    engine.onmessage = function(event) {
      const message = String(event.data);

      if (message === "uciok") {
        engine.postMessage(
          "setoption name Skill Level value " +
          difficulty.value
        );

        engine.postMessage("isready");
      }

      if (message === "readyok") {
        engineReady = true;
        announce("Stockfish gereed! Jy speel met wit. Sterkte: Skill " +
          difficulty.value + ".");
      }

      if (message.startsWith("bestmove")) {
        if (ignoreBestMove) {
          ignoreBestMove = false;
          thinking = false;
          return;
        }

        const uci = message.split(/\s+/)[1];

        if (uci && uci !== "(none)") {
          try {
            const move = game.move({
              from: uci.substring(0,2),
              to: uci.substring(2,4),
              promotion: uci[4] || "q"
            });

            thinking = false;
            renderBoard();

            if (game.isGameOver()) {
              finishGame();
            } else {
              announce("Stockfish speel " + move.san +
                ". Jou beurt.");
              input.focus();
            }

          } catch (error) {
            thinking = false;
            announce("Probleem met Stockfish se skuif.");
          }
        } else {
          thinking = false;
          finishGame();
        }
      }
    };

    engine.onerror = function() {
      engineReady = false;
      thinking = false;
      announce("Stockfish kon nie begin nie. Kontroleer die engine-lêers.");
    };

    engine.postMessage("uci");

  } catch (error) {
    announce("Probleem met Stockfish: " + error.message);
  }
}

document.getElementById("moveForm")
  .addEventListener("submit", event => {
    event.preventDefault();

    makeHumanMove(input.value);
  });

document.getElementById("undo")
  .addEventListener("click", () => {
    if (thinking) {
      announce("Wag totdat Stockfish sy skuif voltooi.");
      return;
    }

    if (game.history().length === 0) return;

    game.undo();

    if (game.turn() === "b") {
      game.undo();
    }

    selectedSquare = null;
    renderBoard();

    announce("Skuif terug geneem. Jou beurt.");
    input.focus();
  });

document.getElementById("restart")
  .addEventListener("click", () => {
    if (thinking && engine) {
      ignoreBestMove = true;
      engine.postMessage("stop");
    }

    thinking = false;
    game.reset();
    selectedSquare = null;

    renderBoard();

    announce("Nuwe wedstryd. Jy speel met wit. Stockfish Skill " +
      difficulty.value + ".");

    input.focus();
  });

difficulty.addEventListener("change", () => {
  applyDifficulty();

  announce("Stockfish se sterkte verander na Skill " +
    difficulty.value + ". Dit geld vir die volgende skuif.");
});

renderBoard();
startEngine();

</script>
</body>
</html>
